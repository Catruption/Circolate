[package]
name = "trackscript-player"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
hound = "3.5"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
claxon = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac", "adpcm"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 3
