[package]
name = "trackscript-player"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
hound = "3.5"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
claxon = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac", "adpcm"] }
zip = "2.2"
sha2 = "0.10"
midly = "0.5"
lewton = "0.10"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 0
